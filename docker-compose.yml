# Phase 6 Module 14 (Production Readiness) + Phase 7 (Frontend) -- local
# development stack. docs/architecture/09-infrastructure.md §2:
# "docker-compose.yml (local development -- bind-mounts source for hot
# reload, exposes debug ports, uses a local .env)... Service list matches
# 01-high-level-architecture.md §7: nginx, web, api, worker, beat, postgres,
# redis." -- all seven services are present below.
#
# The `web` dev service (Next.js) builds only the web.Dockerfile `deps`
# stage (full node_modules, dev toolchain), bind-mounts `./apps/web` for
# hot reload, and runs `next dev` -- the production multi-stage `runner`
# image (output: 'standalone') is what docker-compose.prod.yml + CI build,
# not this dev override. `web_node_modules`/`web_next` named volumes shadow
# the host's node_modules/.next so the container's `npm ci` and `next dev`
# (which run as root in the deps stage) never clobber the host's
# macOS-built install with linux binaries or root-owned .next output.
# Dev API calls default to `http://localhost:8000` (the api service's
# published debug port; CORS_ALLOWED_ORIGINS below already allows
# localhost:3000), matching the pre-Phase-7 local workflow -- the
# same-origin-through-nginx model is a build-time concern for the
# production image (see infra/docker/web.Dockerfile's header).
#
# Usage: `docker compose up --build` from this directory. Requires a
# `.env` file alongside this one -- see `.env.example` for every variable
# referenced below.

name: nurseryverse

x-api-image: &api-image
  build:
    context: ./apps/api
    dockerfile: infra/docker/api.Dockerfile
  image: nurseryverse-api:dev

x-worker-image: &worker-image
  build:
    context: ./apps/api
    dockerfile: infra/docker/worker.Dockerfile
  image: nurseryverse-worker:dev

x-web-image: &web-image
  build:
    context: ./apps/web
    dockerfile: infra/docker/web.Dockerfile
    # Dev-only: target just the `deps` stage, whose /app/node_modules is
    # the full `npm ci` install (all devDependencies + the `next` CLI).
    # The production image (full multi-stage build, standalone `runner`)
    # is what docker-compose.prod.yml and CI build instead.
    target: deps
  image: nurseryverse-web:dev

x-app-env: &app-env
  APP_ENV: development
  APP_DEBUG: "true"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-nurseryverse}
  POSTGRES_USER: ${POSTGRES_USER:-nurseryverse}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nurseryverse_dev_password}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  # JWT_PRIVATE_KEY/JWT_PUBLIC_KEY deliberately left unset in dev --
  # app/core/keys.py's resolve_jwt_keys() generates a real, working
  # ephemeral RSA-2048 keypair per-process whenever APP_ENV != production
  # and no key is configured, exactly so a fresh `docker compose up`
  # works without anyone hand-generating a keypair first (see that
  # module's own docstring). Production MUST set these -- enforced by
  # that same function raising RuntimeError, not by anything in this file.
  CORS_ALLOWED_ORIGINS: '["http://localhost","http://localhost:3000"]'
  # The 50-test Playwright e2e suite self-provisions a unique account per
  # test (~40+ signups per run); the production-safe default of 10 signups
  # per hour would block it. Dev/CI only -- production must set a low value.
  AUTH_SIGNUP_RATE_LIMIT_PER_HOUR: ${AUTH_SIGNUP_RATE_LIMIT_PER_HOUR:-1000}
  # Same story for logins: the serial suite performs ~50 real logins per
  # run from one IP, all inside the 1-per-minute window. Production keeps
  # the safe default of 10/min; dev/CI raise it.
  AUTH_LOGIN_RATE_LIMIT_PER_MINUTE: ${AUTH_LOGIN_RATE_LIMIT_PER_MINUTE:-1000}
  # And for password-reset requests: the suite's anti-enumeration test hits
  # this endpoint once per run from the same IP, which would exhaust the
  # production-safe 5/hour default across repeated runs. Production keeps
  # the safe default; dev/CI raise it.
  AUTH_PASSWORD_RESET_RATE_LIMIT_PER_HOUR: ${AUTH_PASSWORD_RESET_RATE_LIMIT_PER_HOUR:-1000}
  # Run the auth stack in cookie mode (httpOnly nv_refresh_token + CSRF
  # double-submit), the mode the e2e suite and the production deployment
  # assume -- bearer mode (the backend default) deliberately drops the
  # session on a hard page reload, which the suite's page.goto()-based
  # flows require to persist. Both apps fully support it (see
  # apps/web/lib/auth/session-boot.ts and apps/api/app/api/routes/auth.py).
  AUTH_USE_REFRESH_COOKIE: ${AUTH_USE_REFRESH_COOKIE:-true}
  # Secure cookies are only sent by the browser over HTTPS.  The local
  # dev stack runs on plain HTTP (no TLS termination), so the Secure
  # flag must be False here -- otherwise the browser silently refuses to
  # store or transmit the nv_refresh_token / nv_csrf_token cookies,
  # breaking the refresh and CSRF double-submit flows entirely.
  AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE:-false}
  # Ollama runs on the host machine, not inside the Docker network.
  # host.docker.internal resolves to the host on Docker Desktop (macOS/
  # Windows) out of the box. On Linux the `extra_hosts` directive on
  # the api service (below) provides the same mapping.
  LLM_PROVIDER: ollama
  OLLAMA_BASE_URL: http://host.docker.internal:11434
  OLLAMA_CHAT_MODEL: llama3.2
  EMBEDDING_PROVIDER: ollama
  OLLAMA_EMBEDDING_MODEL: mxbai-embed-large
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}

services:
  postgres:
    # pgvector/pgvector, not bare `postgres` -- migrations/versions/
    # 0001_initial_schema.py runs `CREATE EXTENSION IF NOT EXISTS vector`
    # (pgcrypto/pg_trgm ship in every stock Postgres image already; `vector`
    # does not). Pinned to a specific minor, not `latest`, per
    # 08-security-architecture.md §9's immutable-build principle
    # (docs/architecture/09-infrastructure.md §1/§5).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nurseryverse}
      POSTGRES_USER: ${POSTGRES_USER:-nurseryverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nurseryverse_dev_password}
    ports:
      - "5432:5432"  # dev convenience: lets a host-side psql/DBeaver connect directly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nurseryverse} -d ${POSTGRES_DB:-nurseryverse}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [nurseryverse]

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"  # dev convenience: lets a host-side redis-cli connect directly
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [nurseryverse]

  api:
    <<: *api-image
    environment:
      <<: *app-env
    # host.docker.internal: on Docker Desktop (macOS/Windows) this resolves
    # automatically; on Linux Docker the extra_hosts mapping below is needed.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Bind-mounts source for hot reload, per the architecture doc quoted
    # above. Overrides the image's production `gunicorn` CMD with
    # `uvicorn --reload`: gunicorn's worker-recycling model doesn't
    # hot-reload on file change, and running 4 gunicorn workers in dev
    # would also quadruple the ephemeral-JWT-keypair problem (each worker
    # process would mint its own keypair, so a token issued by the worker
    # that handled login might fail verification on the worker that
    # handles the next request) -- a single reloading uvicorn process
    # sidesteps both.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/migrations:/app/migrations
      - ./apps/api/alembic.ini:/app/alembic.ini
    ports:
      - "8000:8000"  # dev convenience: direct access without going through nginx
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [nurseryverse]

  worker:
    <<: *worker-image
    environment:
      <<: *app-env
    command: celery -A app.workers worker --loglevel=info --concurrency=2
    volumes:
      - ./apps/api/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [nurseryverse]

  beat:
    # Reuses the `worker` image with a different command -- not a separate
    # image, per docs/architecture/09-infrastructure.md §1 (see
    # infra/docker/worker.Dockerfile's own header comment).
    <<: *worker-image
    environment:
      <<: *app-env
    command: celery -A app.workers beat --loglevel=info
    # worker.Dockerfile's built-in HEALTHCHECK runs `celery inspect ping`,
    # which is a worker-only RPC -- a `beat` container has no worker
    # process inside it to answer, so the inherited healthcheck would
    # report "unhealthy" forever even when beat is scheduling ticks
    # correctly. Celery beat has no equivalent built-in health RPC (per
    # docs/architecture/09-infrastructure.md §9, beat is supervised at the
    # process level, not via a probe this file can express) -- disabled
    # here rather than left silently wrong. Nothing else's `depends_on`
    # relies on this service being healthy.
    healthcheck:
      test: ["NONE"]
    volumes:
      - ./apps/api/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [nurseryverse]

  web:
    <<: *web-image
    command: sh -c "npm ci && npm run dev -- -H 0.0.0.0"
    environment:
      # Dev default: point the browser's API calls straight at the api
      # service's published debug port (see file header). Override to "" /
      # a custom origin as needed; the production image bakes its own value
      # at build time and never reads this.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    # ./apps/web full bind mount for hot reload; named volumes shadow the
    # host's node_modules (platform-specific darwin bindings must not leak
    # into a linux container, and vice versa) and .next (next dev writes it
    # as root in the deps stage -- keep it off the host's checkout).
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    ports:
      - "3000:3000"  # dev convenience: direct access without going through nginx
    depends_on:
      api:
        condition: service_healthy
    # web.Dockerfile's own HEALTHCHECK lives in its `runner` stage, which
    # this dev override doesn't build (target: deps) -- declared here so
    # nginx's `depends_on: web: service_healthy` (§10) still resolves.
    # busybox wget ships with the node:26-alpine deps stage.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [nurseryverse]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [nurseryverse]

networks:
  nurseryverse:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  web_node_modules:
  web_next:
