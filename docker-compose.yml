# Phase 6 Module 14 (Production Readiness) -- local development stack.
# docs/architecture/09-infrastructure.md §2: "docker-compose.yml (local
# development -- bind-mounts source for hot reload, exposes debug ports,
# uses a local .env)... Service list matches 01-high-level-architecture.md
# §7: nginx, web, api, worker, beat, postgres, redis."
#
# SCOPE NOTE (disclosed deviation, not a silent one): the `web` service
# (Next.js) is omitted here. Phase 7 (Frontend) has not been built in this
# engagement yet -- there is no Next.js app under apps/ to build an image
# from. `nginx` below proxies `/api/*` and `/ws/*` to `api` only; a request
# to `/` will 502 until Phase 7 adds a `web` service and nginx.conf is
# extended to route to it (Task #161's nginx.conf carries the same
# disclosure inline). Every other documented service is present.
#
# Usage: `docker compose up --build` from this directory. Requires a
# `.env` file alongside this one -- see `.env.example` for every variable
# referenced below.
#
# NOT independently run-verified: this development sandbox has no `docker`
# binary (disclosed in docs/architecture/30-module14-production-readiness.md).
# Validated here via `docker compose config` YAML-parse-equivalent manual
# review only.

name: nurseryverse

x-api-image: &api-image
  build:
    context: ./apps/api
    dockerfile: infra/docker/api.Dockerfile
  image: nurseryverse-api:dev

x-worker-image: &worker-image
  build:
    context: ./apps/api
    dockerfile: infra/docker/worker.Dockerfile
  image: nurseryverse-worker:dev

x-app-env: &app-env
  APP_ENV: development
  APP_DEBUG: "true"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-nurseryverse}
  POSTGRES_USER: ${POSTGRES_USER:-nurseryverse}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nurseryverse_dev_password}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  # JWT_PRIVATE_KEY/JWT_PUBLIC_KEY deliberately left unset in dev --
  # app/core/keys.py's resolve_jwt_keys() generates a real, working
  # ephemeral RSA-2048 keypair per-process whenever APP_ENV != production
  # and no key is configured, exactly so a fresh `docker compose up`
  # works without anyone hand-generating a keypair first (see that
  # module's own docstring). Production MUST set these -- enforced by
  # that same function raising RuntimeError, not by anything in this file.
  CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}

services:
  postgres:
    # pgvector/pgvector, not bare `postgres` -- migrations/versions/
    # 0001_initial_schema.py runs `CREATE EXTENSION IF NOT EXISTS vector`
    # (pgcrypto/pg_trgm ship in every stock Postgres image already; `vector`
    # does not). Pinned to a specific minor, not `latest`, per
    # 08-security-architecture.md §9's immutable-build principle
    # (docs/architecture/09-infrastructure.md §1/§5).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nurseryverse}
      POSTGRES_USER: ${POSTGRES_USER:-nurseryverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nurseryverse_dev_password}
    ports:
      - "5432:5432"  # dev convenience: lets a host-side psql/DBeaver connect directly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nurseryverse} -d ${POSTGRES_DB:-nurseryverse}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [nurseryverse]

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"  # dev convenience: lets a host-side redis-cli connect directly
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [nurseryverse]

  api:
    <<: *api-image
    environment:
      <<: *app-env
    # Bind-mounts source for hot reload, per the architecture doc quoted
    # above. Overrides the image's production `gunicorn` CMD with
    # `uvicorn --reload`: gunicorn's worker-recycling model doesn't
    # hot-reload on file change, and running 4 gunicorn workers in dev
    # would also quadruple the ephemeral-JWT-keypair problem (each worker
    # process would mint its own keypair, so a token issued by the worker
    # that handled login might fail verification on the worker that
    # handles the next request) -- a single reloading uvicorn process
    # sidesteps both.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/migrations:/app/migrations
      - ./apps/api/alembic.ini:/app/alembic.ini
    ports:
      - "8000:8000"  # dev convenience: direct access without going through nginx
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [nurseryverse]

  worker:
    <<: *worker-image
    environment:
      <<: *app-env
    command: celery -A app.workers worker --loglevel=info --concurrency=2
    volumes:
      - ./apps/api/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [nurseryverse]

  beat:
    # Reuses the `worker` image with a different command -- not a separate
    # image, per docs/architecture/09-infrastructure.md §1 (see
    # infra/docker/worker.Dockerfile's own header comment).
    <<: *worker-image
    environment:
      <<: *app-env
    command: celery -A app.workers beat --loglevel=info
    # worker.Dockerfile's built-in HEALTHCHECK runs `celery inspect ping`,
    # which is a worker-only RPC -- a `beat` container has no worker
    # process inside it to answer, so the inherited healthcheck would
    # report "unhealthy" forever even when beat is scheduling ticks
    # correctly. Celery beat has no equivalent built-in health RPC (per
    # docs/architecture/09-infrastructure.md §9, beat is supervised at the
    # process level, not via a probe this file can express) -- disabled
    # here rather than left silently wrong. Nothing else's `depends_on`
    # relies on this service being healthy.
    healthcheck:
      test: ["NONE"]
    volumes:
      - ./apps/api/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [nurseryverse]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [nurseryverse]

networks:
  nurseryverse:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
