# Phase 6 Module 14 (Production Readiness) -- production overlay.
# docs/architecture/09-infrastructure.md §2: "docker-compose.prod.yml
# (production overlay -- no bind mounts, resource limits per service,
# `restart: unless-stopped`, references pre-built images by tag rather
# than building in place)."
#
# Applied ON TOP OF docker-compose.yml, not standalone:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Requires Docker Compose v2.24.4+ for the `!override` and `!reset` merge
# tags used below. `!override` REPLACES docker-compose.yml's dev-only host
# port publishes / bind mounts / environment entirely (rather than Compose's
# default list-concatenation / map-merge, which would otherwise leave them
# in place alongside this file's replacements). `!reset` REMOVES the dev-only
# `build:` and `command:` keys so each service runs its pre-built image and
# the image's own baked production CMD, not the dev build/command. A bare
# `null` cannot be used for this: `build:` must be a string or mapping, so
# `build: null` fails schema validation ("services.<svc>.build must be a
# string") -- the removal must be expressed with the `!reset` tag.
#
# Images are referenced by tag (`${API_IMAGE_TAG}` etc.), built and pushed
# by the GitHub Actions pipeline (see .github/workflows/ci.yml) -- this
# file never runs `docker build` itself, per the architecture doc's
# "rather than building in place" above. Secrets (POSTGRES_PASSWORD,
# JWT_PRIVATE_KEY/PUBLIC_KEY, ANTHROPIC_API_KEY, etc.) must come from the
# deployment platform's own secret store / a `.env` that is itself never
# committed -- this file only ever references them by `${VAR}`
# substitution, never inlines a value.

name: nurseryverse

services:
  postgres:
    restart: unless-stopped
    ports: !override []  # no host-published port in production -- only nginx faces the internet
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  redis:
    restart: unless-stopped
    ports: !override []  # no host-published port in production -- only nginx faces the internet
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          memory: 128M

  api:
    build: !reset null  # remove dev build: run the pre-built ${API_IMAGE_TAG} image, never build in place
    image: ${API_IMAGE_TAG:?API_IMAGE_TAG must be set, e.g. ghcr.io/org/nurseryverse-api:1.4.2}
    command: !reset null  # remove dev `uvicorn --reload`: fall back to the image's own production CMD (gunicorn+uvicorn workers)
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      WEB_CONCURRENCY: ${API_WEB_CONCURRENCY:-4}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-voyage}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    volumes: !override []  # no bind mounts -- the built image is the deployable artifact, per the architecture doc quoted above
    ports: !override []  # only nginx is reachable from outside the Compose network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G

  worker:
    build: !reset null  # remove dev build: run the pre-built ${WORKER_IMAGE_TAG} image
    image: ${WORKER_IMAGE_TAG:?WORKER_IMAGE_TAG must be set, e.g. ghcr.io/org/nurseryverse-worker:1.4.2}
    # command NOT reset: docker-compose.yml's `celery -A app.workers worker`
    # is the production worker command (not a dev-only command like the api's
    # `--reload`), so it is inherited as-is.
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes: !override []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G  # highest of the four app services -- torch/xgboost/prophet inference runs here, not in `api`
        reservations:
          cpus: "0.5"
          memory: 1G

  beat:
    build: !reset null  # remove dev build: run the pre-built ${WORKER_IMAGE_TAG} image (beat reuses the worker image)
    image: ${WORKER_IMAGE_TAG:?WORKER_IMAGE_TAG must be set, e.g. ghcr.io/org/nurseryverse-worker:1.4.2}
    # command NOT reset: docker-compose.yml's `celery -A app.workers beat`
    # is the production beat command (and the base already sets
    # `healthcheck: [NONE]` for beat, inherited here), so both are kept as-is.
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes: !override []
    restart: unless-stopped
    deploy:
      # Celery beat must never run more than one replica at a time (two
      # beat processes would each independently fire every scheduled
      # task, double-running both sweeps in app/workers.py) -- pinned
      # explicitly rather than left to default, since `deploy.replicas`
      # is the one place in this file where "unset" could silently become
      # "more than one" under some orchestrators.
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  web:
    build: !reset null  # remove dev build (target: deps): run the pre-built ${WEB_IMAGE_TAG} standalone image
    image: ${WEB_IMAGE_TAG:?WEB_IMAGE_TAG must be set, e.g. ghcr.io/org/nurseryverse-web:1.4.2}
    # Remove docker-compose.yml's dev command `sh -c "npm ci && npm run dev
    # -- -H 0.0.0.0"`. That command targets the `deps` stage's full
    # node_modules + `next` CLI; the production `runner` image is the Next.js
    # standalone output and has no npm / package.json / dev toolchain, so the
    # dev command would fail there. Falls back to the image's own production
    # CMD -- `node server.js`, the standalone server (web.Dockerfile runner).
    command: !reset null
    # No environment override: the production image has its origin baked
    # at build time (NEXT_PUBLIC_API_BASE_URL, see web.Dockerfile's
    # header) -- it never reads the dev compose's NEXT_PUBLIC_API_BASE_URL.
    environment: !override {}
    volumes: !override []  # no bind mounts / named dev volumes -- the built image is the deployable artifact
    ports: !override []  # only nginx is reachable from outside the Compose network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nginx:
    restart: unless-stopped
    # !override, not default list-merge: docker-compose.yml's nginx already
    # publishes ["80:80"], and Compose's default is to CONCATENATE port lists
    # -- that would yield ["80:80", "80:80", "443:443"], a duplicate host-port
    # bind that fails at `up` with "port is already allocated". Replacing the
    # list (same pattern as this service's volumes below, and the other
    # services' `ports: !override []`) publishes exactly 80 + 443.
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      # TLS certificate material -- path is a deployment-platform choice
      # (certbot volume, mounted secret, etc.); not populated by this
      # repo. docs/architecture/09-infrastructure.md §3: "TLS termination
      # (cert managed via the deployment platform or Let's Encrypt/
      # certbot, outside the scope of the Compose stack itself)."
      - ${TLS_CERT_DIR:-./infra/nginx/certs}:/etc/nginx/certs:ro
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
