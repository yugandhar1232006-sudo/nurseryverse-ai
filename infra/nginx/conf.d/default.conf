# Phase 6 Module 14 (Production Readiness) + Phase 7 (Frontend) -- server
# block / routing. docs/architecture/09-infrastructure.md §3:
# "routing (`/` → `web`, `/api/*` → `api`, `/ws/*` → `api` with
# `Upgrade`/`Connection` headers passed through for the WebSocket
# handshake)". `web_backend` below serves the Next.js standalone server
# (`web` service, port 3000); `api_backend` serves FastAPI.
#
# Route inventory (from app/api/router.py -- root_router mounts health
# checks unprefixed, api_v1_router mounts every business module under
# settings.API_V1_PREFIX = "/api/v1", app/main.py wires both):
#   /health, /healthz, /readyz    -- /health is the *web* service's own
#                                      lightweight liveness route
#                                      (apps/web/app/health/route.ts), so
#                                      it is NOT routed to api_backend --
#                                      it falls through to `location /`
#                                      and reaches the Next.js server;
#                                      /healthz and /readyz are the API's
#                                      liveness/readiness and are proxied
#                                      directly to api_backend below.
#   /api/v1/*                      -- every business route, including the
#                                      one WebSocket endpoint this API has
#                                      (`/api/v1/notifications/ws`,
#                                      app/api/routes/notifications.py) --
#                                      covered by the same `/api/` location
#                                      block below, with Upgrade/Connection
#                                      headers always forwarded so the one
#                                      path that needs them gets them,
#                                      without needing a second location
#                                      block just for `/ws`.
#   /docs, /redoc, /openapi.json   -- OpenAPI docs (docs_url/redoc_url are
#                                      None in production -- app/main.py
#                                      -- so these 404 from the app itself
#                                      in prod; Nginx doesn't need to know
#                                      that and just proxies them through).
#   /metrics                        -- deliberately NOT proxied. Per
#                                      09-infrastructure.md §7 ("a
#                                      production deployment restricts
#                                      scrape access at the network/Nginx
#                                      layer, not by making Prometheus
#                                      authenticate as an application
#                                      user"), Prometheus should scrape
#                                      `api:8000/metrics` directly over the
#                                      internal Compose network, never
#                                      through this public-facing proxy.

upstream api_backend {
    server api:8000;
    keepalive 32;
}

upstream web_backend {
    server web:3000;
    keepalive 32;
}

# Standard websocket-upgrade Connection-header map: forwards "upgrade"
# when the client actually requested one ($http_upgrade set), otherwise
# forwards a plain "close" -- the canonical Nginx idiom for a proxy that
# serves both regular HTTP and the occasional WebSocket route behind the
# same location block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # In production, uncomment and point at real certificate material
    # mounted via docker-compose.prod.yml's `TLS_CERT_DIR` volume (see
    # that file's `nginx` service comment) -- left commented rather than
    # referencing a certificate path that doesn't exist in this
    # repository, which would fail Nginx's own startup.
    #
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # # Redirect plain HTTP to HTTPS once a cert is actually configured --
    # # left as `return 301` commented alongside the ssl_* directives so
    # # the two ship together, not one without the other.
    # if ($scheme = http) {
    #     return 301 https://$host$request_uri;
    # }

    # --- Security headers -- deferred here from the FastAPI application
    # layer per this module's own security-hardening audit (Task #156):
    # docs/architecture/09-infrastructure.md §3 assigns these to Nginx,
    # not application middleware, and 08-security-architecture.md §9 lists
    # the same set. Applied to every response via `always`, including
    # error responses (a 4xx/5xx page is still a response an attacker
    # could probe for clickjacking/MIME-sniffing purposes). ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # `default-src 'self'` is the restrictive baseline. The `web` frontend
    # (Phase 7) needs the additions below, each justified by a real
    # requirement rather than preemptive loosening:
    #   script-src 'self' 'unsafe-inline' -- Next.js App Router inlines its
    #     RSC bootstrap payload in <script> tags in production HTML
    #     (self.__next_f). No third-party scripts are loaded.
    #   style-src 'self' 'unsafe-inline' -- inline style attributes (Radix,
    #     framer-motion, shadcn/ui positioning).
    #   img-src 'self' data: https: -- plant/document images are
    #     backend-hosted absolute URLs (Cloudinary via the api's upload
    #     endpoints), fetched directly by plain <img> tags (the app does
    #     not use next/image -- docs/architecture/04-frontend-architecture.md).
    #   font-src 'self' data: -- self-hosted @fontsource/inter plus any
    #     data:-URL fallbacks.
    #   connect-src 'self' ws: wss: -- same-origin /api/* fetches plus the
    #     notifications WebSocket (same-origin through nginx in production,
    #     cross-origin ws://localhost:8000 in local dev).
    # `frame-ancestors 'none'` (X-Frame-Options DENY, below) blocks
    # clickjacking; `base-uri`/`form-action` lock down the same-origin
    # trust anchors.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://localhost:8000 ws: wss:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    client_max_body_size 15m;

    location /healthz {
        proxy_pass http://api_backend/healthz;
        proxy_set_header Host $host;
    }

    location /readyz {
        proxy_pass http://api_backend/readyz;
        proxy_set_header Host $host;
    }

    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
    }

    # Explicit deny, ahead of the `/api/` block below, rather than simply
    # "not proxied" -- makes the intent (see this file's header comment)
    # unambiguous in the config itself, not just in a comment that could
    # drift from behavior.
    location = /metrics {
        return 404;
    }

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Echoes an inbound X-Request-ID if the client set one, otherwise
        # forwards Nginx's own generated $request_id -- either way,
        # app/core/middleware.py's RequestContextMiddleware receives a
        # correlation id it can trust rather than minting its own,
        # letting one id trace a request across both the edge and app
        # logs (see nginx.conf's `$request_id_final` map).
        proxy_set_header X-Request-ID $request_id_final;

        # WebSocket upgrade support -- required for
        # /api/v1/notifications/ws (Module 11); a no-op for every other,
        # non-upgrade request under this same location block (`$http_upgrade`
        # is empty, so `$connection_upgrade` resolves to "close", which is
        # the normal keep-alive-compatible value for plain HTTP anyway).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A WebSocket connection is long-lived by design (Module 11's hub
        # holds it open until the client disconnects) -- Nginx's default
        # 60s proxy_read_timeout would silently kill an idle-but-still-
        # connected notification socket. 3600s (1h) comfortably exceeds
        # any realistic idle gap between notification pushes; a genuinely
        # dead connection is still caught by TCP keepalive well before that.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else is the Next.js frontend (`/` → `web` per §3). Next's
    # standalone production server serves the HTML/JS/CSS and already sets
    # its own immutable Cache-Control on content-hashed /_next/static
    # assets, so no per-asset location or cache header is needed here --
    # a plain proxy passes those through untouched. /health (the web
    # service's liveness route) and /_next/static fall into this block by
    # design. X-Request-ID keeps the same correlation id as the /api/ block
    # so one id traces a request across web and api.
    location / {
        proxy_pass http://web_backend;
        proxy_http_version 1.1;

        # Next.js Turbopack HMR WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_final;
    }
}
