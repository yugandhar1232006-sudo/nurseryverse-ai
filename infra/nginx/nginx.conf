# Phase 6 Module 14 (Production Readiness) -- Nginx main config.
# docs/architecture/09-infrastructure.md §3: "Single Nginx instance,
# responsibilities: TLS termination ..., routing ..., security headers
# (HSTS, CSP, X-Frame-Options, X-Content-Type-Options -- per
# 08-security-architecture.md §9), gzip/brotli compression for static
# assets, and request size limits."
#
# Server-block routing rules live in conf.d/default.conf; this file is
# process-level config shared by every server block Nginx loads.
#
# NOT independently run-verified: this development sandbox has no `nginx`
# binary (disclosed in docs/architecture/30-module14-production-readiness.md).
# Validated here via manual structural review only -- `nginx -t` against a
# real Nginx image (e.g. in Task #162's CI pipeline, or the first real
# `docker compose up`) is this file's first genuine syntax check.

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Propagates the same request correlation id app/core/middleware.py's
    # RequestContextMiddleware already generates/echoes on `X-Request-ID` --
    # if the client didn't send one, Nginx mints one here (via $request_id,
    # an Nginx-builtin variable) so even a request that never reaches the
    # app (e.g. rejected by a future rate-limit zone) still has a
    # traceable id in the access log. Declared before `log_format` below
    # since that directive references it.
    map $http_x_request_id $request_id_final {
        default   $http_x_request_id;
        ""        $request_id;
    }

    # Structured-ish access log -- deliberately close to the JSON shape
    # app/core/logging.py's structlog processors already emit for the
    # application services, so an aggregator ingesting both doesn't need
    # two different parsers for "the edge" vs "the app"
    # (docs/architecture/09-infrastructure.md §8).
    log_format main_json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"request_id":"$request_id_final",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
        '}';
    access_log /var/log/nginx/access.log main_json;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Request size limit ahead of the application layer -- redundant with,
    # but checked before, the app-level upload-size validation
    # (docs/architecture/08-security-architecture.md §8/09-infrastructure.md
    # §3). 15M covers the largest documented upload (plant images via
    # Module 5/6's Cloudinary-backed image uploads) with headroom, without
    # leaving the limit effectively unbounded.
    client_max_body_size 15m;

    # gzip compression for the text-based responses this API/future web
    # frontend actually serves (JSON API responses, HTML/JS/CSS once
    # Phase 7 adds `web`). Brotli is not included: it requires a
    # non-default Nginx module (`ngx_brotli`) not present in the stock
    # `nginx:1.27-alpine` image referenced in docker-compose.yml: -- would
    # need a custom-built Nginx image to add, which is a real, disclosed
    # gap against the architecture doc's "gzip/brotli" wording, not an
    # oversight. gzip alone already covers the compression requirement for
    # every response type this API currently returns.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain
               text/xml application/xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
